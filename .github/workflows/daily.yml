name: Daily Pipeline

on:
  # 2026-11-06：项目作废，仓库仅作 GitHub 留档，每日定时发布已停用。
  # 原 schedule 为 '0 20 * * *'（北京 04:00 低峰期）。不要改回去，
  # 否则会继续每天自动提交数据、触发 Vercel 重新发布。
  # 仅保留 workflow_dispatch，需要补跑某一天时手动触发即可。
  workflow_dispatch:       # 手动触发（当前唯一入口）
    inputs:
      target_date:
        description: '可选：指定快照日期 YYYY-MM-DD（补跑某天用），留空按下一次槽位'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

# 手动补跑可能与上一次运行重叠：串行排队而不是并行，
# 避免两个 job 同时 git push 造成 non-fast-forward 失败
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      # 沿用旧 cron 槽位（20:00 UTC）：留空 target_date 时快照归属「最近一次槽位」所在日期
      PIPELINE_SLOT_UTC_HOUR: '20'
      # 手动补跑指定日期时生效（留空则按槽位规则；格式非法会被 aggregate 忽略并告警）
      PIPELINE_TARGET_DATE: ${{ inputs.target_date }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Run data pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd data
          python3.11 pipeline.py

      # pipeline.py 第 4 步已自行同步 4-final → app/src/data + public，
      # 无需重复 cp（旧步骤的 `|| true` 还会掩盖同步失败）

      - name: Validate data
        run: |
          cd data
          python3.11 scripts/validate_data.py

      # 空洞曾经完全静默：只在很久以后被人从趋势热力图少一列发现。
      # 退出码恒为 0（红了的管线不会提交数据，反而制造更大空洞），只发 warning 注解。
      - name: Check history continuity
        run: |
          cd data
          python3.11 scripts/check_history.py --days 30

      - name: Check for changes
        id: changes
        run: |
          # 先 git add -A，让 untracked 文件也纳入 diff --cached 判断
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          cd app
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Commit and push to main
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "devfocus-bot"
          git config user.email "bot@devfocus.cc"
          git add -A
          # 提交信息用管线锚定后的快照日期，而不是运行时日期：
          # 跨零点的运行归属前一天，避免连续两个同名的 "daily update" 提交
          DATE=$(python3.11 -c 'import json;print(json.load(open("data/4-final/digest-meta.json"))["date"])' 2>/dev/null)
          [ -n "$DATE" ] || DATE=$(date -u +%F)
          git commit -m "data: daily update $DATE"
          git push
