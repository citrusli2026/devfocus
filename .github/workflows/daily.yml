name: Daily Pipeline

on:
  schedule:
    # 北京低峰期：北京时间 04:00 = UTC 前一日 20:00。
    # 原 UTC 0:00（北京 08:00 早高峰）改为凌晨，管线约 70-80 分钟，
    # 05:15 左右完成，早晨醒来前数据已就绪。
    # 注意 1：GitHub 不保证 schedule 准时——实测常延迟 2~4 小时，偶尔跨过 UTC 零点。
    #   快照日期因此按「cron 槽位」而非运行时日期锚定（PIPELINE_SLOT_UTC_HOUR），
    #   跨零点不会再吞掉前一天的快照（2026-09-28 事故，见 _shared.resolve_target_date）。
    # 注意 2：改这个 cron 必须同步改下面 job env 里的 PIPELINE_SLOT_UTC_HOUR。
    - cron: '0 20 * * *'
  workflow_dispatch:       # 手动触发
    inputs:
      target_date:
        description: '可选：指定快照日期 YYYY-MM-DD（补跑某天用），留空按下一次槽位'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

# 定时任务被延迟后可能与下一次触发重叠：串行排队而不是并行，
# 避免两个 job 同时 git push 造成 non-fast-forward 失败
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      # 与上面 cron 的 UTC 小时一致（20:00 UTC）：快照归属「最近一次槽位」所在日期
      PIPELINE_SLOT_UTC_HOUR: '20'
      # 手动补跑指定日期时生效（留空则按槽位规则；格式非法会被 aggregate 忽略并告警）
      PIPELINE_TARGET_DATE: ${{ inputs.target_date }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Prepare secrets
        run: |
          echo "${{ secrets.PH_TOKEN }}" > data/.ph_token

      - name: Run data pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd data
          python3.11 pipeline.py

      # pipeline.py 第 4 步已自行同步 4-final → app/src/data + public，
      # 无需重复 cp（旧步骤的 `|| true` 还会掩盖同步失败）

      - name: Validate data
        run: |
          cd data
          python3.11 scripts/validate_data.py

      # 空洞曾经完全静默：只在很久以后被人从趋势热力图少一列发现。
      # 退出码恒为 0（红了的管线不会提交数据，反而制造更大空洞），只发 warning 注解。
      - name: Check history continuity
        run: |
          cd data
          python3.11 scripts/check_history.py --days 30

      - name: Check for changes
        id: changes
        run: |
          # 先 git add -A，让 untracked 文件也纳入 diff --cached 判断
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          cd app
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Commit and push to main
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "devfocus-bot"
          git config user.email "bot@devfocus.cc"
          git add -A
          # 提交信息用管线锚定后的快照日期，而不是运行时日期：
          # 跨零点的运行归属前一天，避免连续两个同名的 "daily update" 提交
          DATE=$(python3.11 -c 'import json;print(json.load(open("data/4-final/digest-meta.json"))["date"])' 2>/dev/null)
          [ -n "$DATE" ] || DATE=$(date -u +%F)
          git commit -m "data: daily update $DATE"
          git push
